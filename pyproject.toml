[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-deck"
version = "0.1.0"
description = "Turn one Markdown file into a deterministic 16:9 PDF slide deck."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Yohei Onishi" },
]
keywords = ["markdown", "pdf", "slides", "deck"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "markdown>=3.5",
  "playwright>=1.40",
  "pypdf>=4.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/yohei1126/md-deck"
Repository = "https://github.com/yohei1126/md-deck"
Issues = "https://github.com/yohei1126/md-deck/issues"

[project.scripts]
md-deck = "md_deck.build:cli"

[tool.hatch.build.targets.wheel]
packages = ["md_deck"]

[tool.hatch.build.targets.sdist]
include = [
  "/md_deck",
  "/examples",
  "/docs",
  "/LICENSE",
  "/README.md",
  "/action.yml",
]
