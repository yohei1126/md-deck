name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install Python deps and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build examples/sample.md
        run: |
          mkdir -p out
          python -m md_deck examples/sample.md \
            -o out/sample.pdf \
            --style examples/deck_style.md \
            --check-deterministic

      - name: Upload sample PDF
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdf
          path: out/sample.pdf
          if-no-files-found: error
