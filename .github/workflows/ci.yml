name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Sync project
        run: uv sync --frozen --group dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Unit tests
        run: uv run pytest -q

      - name: Check examples/sample.md
        run: uv run md-deck check examples/sample.md

      - name: Check and build diagram pattern examples
        run: |
          uv run md-deck check examples/diagram_patterns.md
          uv run md-deck build examples/diagram_patterns.md \
            -o out/diagram-patterns.pdf

      - name: Build examples/sample.md
        run: |
          mkdir -p out
          uv run md-deck build examples/sample.md \
            -o out/sample.pdf \
            --check-deterministic

      - name: Upload sample PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-pdf
          path: out/sample.pdf
          if-no-files-found: error
