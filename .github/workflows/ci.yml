name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Sync project and install Chromium
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium

      - name: Build examples/sample.md
        run: |
          mkdir -p out
          uv run md-deck examples/sample.md \
            -o out/sample.pdf \
            --style examples/deck_style.md \
            --check-deterministic

      - name: Upload sample PDF
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdf
          path: out/sample.pdf
          if-no-files-found: error
